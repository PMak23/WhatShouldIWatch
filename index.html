<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151b26">
<title>What's On</title>
<style>
  :root{
    --bg:#151b26; --panel:#1d2532; --line:#2a3444;
    --ink:#f2f4f7; --ink-2:#aab3c2; --ink-3:#6d778a;
    --hot:#ff4d3d; --warm:#ff9a2e; --mild:#e8c547; --cool:#5c6b82;
    --chip:#243042; --chip-on:#f2f4f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.35 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .layout{display:block}
  .main{min-width:0}
  .sidebar{display:none}
  @media (min-width:900px){
    .layout{display:flex;align-items:flex-start}
    .main{flex:1;min-width:0}
    .sidebar{display:block;flex:0 0 320px;width:320px;border-left:1px solid var(--line);
      position:sticky;top:0;max-height:100vh;overflow-y:auto}
  }
  .sidebar-title{margin:18px 16px 6px;font-size:16px;font-weight:800}
  .sidebar-empty{margin:0 16px;padding:12px 0;color:var(--ink-3);font-size:13px;line-height:1.4}
  .mobile-only-list{display:none}
  .mobiletabs{display:none}
  @media (max-width:899px){
    body{padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
    .mobiletabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;
      border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
    .mobiletabs button{flex:1;padding:14px 0;background:none;border:0;color:var(--ink-3);
      font-size:13px;font-weight:600;cursor:pointer}
    .mobiletabs button.on{color:var(--ink)}
    body.tab-watchlist #list{display:none}
    body.tab-watchlist .mobile-only-list{display:block}
  }
  header{padding:18px 16px 10px;display:flex;align-items:baseline;justify-content:space-between}
  h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
  #updated{font-size:12px;color:var(--ink-3)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:0;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;
    background:var(--chip);color:var(--ink-2);cursor:pointer}
  .chip.on{background:var(--chip-on);color:var(--bg)}
  .chip:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
  .chip.bulk{background:none;border:1px solid var(--line);color:var(--ink-2);padding:7px 12px}
  .chip.bulk:hover{color:var(--ink)}
  .chip-sep{flex:0 0 1px;background:var(--line);margin:4px 2px}
  h2{margin:14px 16px 6px;font-size:13px;font-weight:600;color:var(--ink-3)}
  h3.day{margin:10px 16px 4px;font-size:12px;font-weight:600;color:var(--ink-3);opacity:.75}
  .game{display:grid;grid-template-columns:74px 1fr;gap:0 12px;align-items:center;
    padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent;
    position:relative}
  .game:last-child{border-bottom:1px solid var(--line)}
  .star{position:absolute;top:8px;right:10px;font-size:18px;line-height:1;color:var(--ink-3);
    background:none;border:0;padding:6px;cursor:pointer;z-index:2;opacity:.7}
  .star:hover{opacity:1}
  .star.on{color:var(--warm);opacity:1}
  .rating{font-size:38px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
  .rating small{display:block;font-size:13px;font-weight:800;letter-spacing:.06em;margin-top:5px;color:var(--ink-2)}
  .r-hot{color:var(--hot)} .r-warm{color:var(--warm)} .r-mild{color:var(--mild)} .r-cool{color:var(--cool)}
  .pre .rating{opacity:.85}
  .teams{display:flex;gap:14px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
  .teams span{white-space:nowrap}
  .teams .lead{color:var(--ink)} .teams .trail{color:var(--ink-2)}
  .teams .rank{font-size:12px;font-weight:600;color:var(--ink-3);margin-right:3px}
  .status{font-size:13px;color:var(--ink-2);margin-top:2px}
  .status b{font-weight:700;color:var(--ink)}
  .nets{margin-top:2px}
  .net-nat{font-size:13px;font-weight:700;color:var(--ink)}
  .net-loc{font-size:12px;color:var(--ink-3)}
  .why{font-size:13px;color:var(--ink-3);margin-top:2px;display:flex;justify-content:space-between;align-items:center}
  .chevron{font-size:10px;color:var(--ink-3);opacity:.6;margin-left:8px}
  .breakdown{display:none;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .game.expanded .breakdown{display:flex}
  .subscore{display:flex;flex-direction:column;gap:2px}
  .subscore span{font-size:11px;color:var(--ink-3)}
  .subscore b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
  .empty,.err{padding:18px 16px;color:var(--ink-3);font-size:14px}
  .err{color:#ff9a8f}
  footer{padding:20px 16px 28px;font-size:12px;color:var(--ink-3)}
  @media (prefers-reduced-motion:no-preference){.game{transition:background .2s}}
</style>
</head>
<body>
<div class="layout">
<div class="main">
<header>
  <h1>What's On</h1>
  <span id="updated"></span>
</header>
<div class="chips" id="chips"></div>
<main id="list"></main>
<footer>Ratings 1 to 10. Based on how close it is, time left, odds, upsets, playoffs and national TV. Refreshes every 30 seconds.</footer>
</div>
<aside class="sidebar">
  <h2 class="sidebar-title">My Watchlist</h2>
  <div id="watchlist"></div>
</aside>
</div>
<div id="mobileWatchlist" class="mobile-only-list"></div>
<nav class="mobiletabs">
  <button data-tab="all" class="on">All Games</button>
  <button data-tab="watchlist">Watchlist</button>
</nav>

<script>
// ---------- TUNING KNOBS: change these numbers to tune the ratings ----------
const W = {
  softCeiling: 8.0,     // below this, ratings work exactly as the rest of this file describes.
  softCeilingSoftness: 2.0, // above softCeiling, HIGHER = harder to reach 10 (needs more stacked raw excitement)
  // Pregame games get their own ceiling: even a "game of the century" tops out
  // near preMax before kickoff. 9+ and 10 are reserved for games delivering live.
  preSoftCeiling: 8.0,  // pregame: below this, no compression
  preMax: 9.2,          // pregame: displayed rating approaches this but never reaches it
  preSoftness: 2.0,     // pregame: HIGHER = slower approach to preMax
  qualityCapBase: 6.0,  // hard ceiling for the least notable teams (quality01=0) — see quality01 below
  qualityCapRange: 4.0, // qualityCapBase + this = ceiling for the most notable teams (quality01=1) — 6+4=10, uncapped
  stakesFloor: -3.0,    // ctx value that shows as Stakes=0
  stakesRange: 10.0,    // ctx this far above stakesFloor shows as Stakes=10
  playoffRace: 2.0,     // max ctx swing when both teams' race intensity (0-1, live-computed or hand list) hits 1.0
  raceMinPlayoffPct: 0.30, // below this real playoff-percent, no race credit regardless of how close the raw standings math looks
  liveBase: 1.5,      // every live game starts here
  liveClose: 5.0,     // max points for being close
  // How much closeness counts, at each stage of the game — NOT capped at 1.0x.
  // A tie late matters more than a tie early, and a tie in overtime matters most
  // of all, so this is allowed to exceed "full weight." Smoothly interpolated
  // between these checkpoints, not a hard jump between stages.
  timeStart: 0.7,     // kickoff / 1st inning
  timeMid: 1.0,       // halfway through
  timeLate: 1.3,      // start of the final period / 7th-8th inning
  timeEnd: 1.5,       // end of regulation / final inning
  timeOT: 1.7,         // overtime / extra innings
  wireBonus: 1.0,     // late and within one score
  otBonus: 1.5,       // overtime / extra innings
  upsetBonus: 1.0,    // underdog leading (plus up to +1 more for bigger dogs)
  playoff: 1.5,       // postseason game
  preseason: -3.0,    // exhibition game (ESPN season type 1) — starters often sit
  seriesElim: 0.9,    // (was 0.5, raised Oct 7) ADDITIONAL, playoff series game where one team can be eliminated
  seriesDecider: 1.4, // (was 1.0, raised Oct 7) ADDITIONAL (instead of seriesElim), winner-take-all final game of a series
  championship: 2.0,  // (added Oct 24) ADDITIONAL, title round: World Series, NBA/WNBA Finals, Stanley Cup Final, Super Bowl, MLS Cup, CFB title game
  champImportanceFloor: 9.0, // Importance display never shows below this in a title-round game
  semifinal: 1.0,     // (added Oct 24) ADDITIONAL, round before the title: ALCS/NLCS, conference finals, AFC/NFC title games, CFP/WNBA semis
  elimImportanceFloor: 8.0,    // Importance display never shows below this when one team faces elimination
  deciderImportanceFloor: 9.0, // Importance display never shows below this in a winner-take-all game
  national: 0.2,      // on national TV (kept minimal on purpose)
  evening: 0.1,       // starts 5 to 9 PM your time (kept minimal on purpose)
  rankedBoth: 0.7,    // both teams ranked (college)
  top10: 0.3,         // a top-10 team is playing (college)
  top10Showdown: 0.6, // ADDITIONAL, on top of rankedBoth — both teams top-10 specifically
  rankedTrailing: 2.0, // max bonus for a ranked team currently behind — scaled by rank AND how close the game still is
  standings: 2.0,      // max swing from combined record vs .500 (both bad = down, both good = up)
  watchability: 1.5,   // max swing from the WATCHABILITY list below (5=marquee, 1=skip)
  teamWatch: 1.5,       // max swing from TEAM_QUALITY (both teams' brand/power ranking)
  // Season ramp (pro leagues with a TEAM_QUALITY list only): early on, power
  // rankings drive team strength; standings phase in as games are played.
  // Standings share of the team-strength signal: 0% at game 1 -> rampMid at
  // rampPoint of the season -> rampMax at 2x rampPoint, then holds.
  rampPoint: 0.25,     // fraction of season played where rankings/standings are 50/50
  rampMid: 0.5,        // standings share at rampPoint
  rampMax: 0.8,        // standings share from 2x rampPoint onward (rankings keep 20%)
  rankQuality: 1.5,    // max swing from ranking/conference quality (college) — see quality01. Was 3.0; cut Sept 26 because college stacks this on top of ranked bonuses + watchability
  sportInterest: 1.2,  // max swing from each sport's interest baseline (see SPORTS above)
  preBase: 3.0,       // upcoming games start here
  preSpread: 3.5,     // max points for a tight spread (before the team-quality multiplier)
  finalBase: 2.0, finalClose: 4.0, finalOT: 2.0, finalUpset: 1.5, finalContext: 0.7
};

// Sports you can pick. unit = "one score". upset = spread that counts as a real underdog.
// interest = baseline general-audience attention, -1 to 1, applied flat to every
// game in that sport. This is a judgment call, not pulled from any data source —
// tune these numbers freely, they're just a starting point.
const SPORTS = { // MLB interest lowered 0.1 -> -0.5 on Sept 26 (baseball moneylines always read close, so it needs a lower baseline)
  nfl:  {name:'NFL', games:17,  path:'football/nfl/scoreboard',                       standingsPath:'football/nfl/standings', unit:8, spreadBased:true, periods:4, len:15, clockDown:true, interest:0.8},
  cfb:  {name:'CFB',  path:'football/college-football/scoreboard?groups=80&limit=100', unit:8, spreadBased:true, periods:4, len:15, clockDown:true, interest:-0.2, hasRanking:true, preCloseAt:21}, // interest was 0.6; lowered Sept 26 — CFB rated too high vs everything else
  mlb:  {name:'MLB', daily:true, games:162,  path:'baseball/mlb/scoreboard',                        standingsPath:'baseball/mlb/standings', unit:4, interest:-0.5, innings:9},
  nba:  {name:'NBA', daily:true, games:82,  path:'basketball/nba/scoreboard',                      standingsPath:'basketball/nba/standings', unit:3, closeAt:15, blowoutAt:[30,25], spreadBased:true, periods:4, len:12, clockDown:true, interest:0.5},
  nhl:  {name:'NHL', daily:true, games:84,  path:'hockey/nhl/scoreboard',                          standingsPath:'hockey/nhl/standings', unit:1, interest:-1.0, periods:3, len:20, clockDown:true}, // interest -0.1 -> -1.0 Oct 3: low national viewership (~546K avg regular season) + hockey moneylines always read close
  cbb:  {name:'CBB', daily:true,  path:'basketball/mens-college-basketball/scoreboard?groups=50&limit=100', unit:3, closeAt:15, blowoutAt:[30,25], spreadBased:true, interest:0.3, periods:2, len:20, clockDown:true, hasRanking:true},
  wnba: {name:'WNBA', daily:true, path:'basketball/wnba/scoreboard',                     standingsPath:'basketball/wnba/standings', unit:3, closeAt:15, blowoutAt:[30,25], spreadBased:true, interest:-0.3, periods:4, len:10, clockDown:true},
  mls:  {name:'MLS',  path:'soccer/usa.1/scoreboard',                        unit:1, interest:-0.4, periods:2, len:45, clockDown:false, liveScale:0.8}, // liveScale added Oct 10: a late 1-1 MLS game was rating 8.2, above ranked CFB. Draws are routine in soccer, so a tie late isn't the same drama as a tied football game
  epl:  {name:'EPL',  path:'soccer/eng.1/scoreboard',                        unit:1, interest:-0.2, periods:2, len:45, clockDown:false},
};
const DEFAULT_ON = ['nfl','cfb','mlb'];

// Update this by hand once a week. Week 9 (Oct 31, 2026) comes straight from
// Covers' "Top 25 Predictions: Watchability Ratings" (Rob Paul) — its X/5 rating is used as-is.
// Key = both teams' abbreviations AS SHOWN IN THIS APP, sorted alphabetically,
// joined with a dash, so it doesn't matter who's home/away.
// Scale: 5 = must-watch, 3 = average (no effect), 1 = skip it.
// Keys = both ESPN abbreviations, sorted A-Z, joined by '-'. Use ESPN's exact codes
// (TA&M not TXAM, MIZ not MIZZ, NCSU not NCST, IU/NU, BOIS) or the entry silently does nothing.
const WATCHABILITY = {
  'FLA-UGA':    5,   // Florida vs Georgia (Jacksonville)
  'ARIZ-TTU':   5,   // Arizona at Texas Tech
  'OSU-USC':    4,   // Ohio State at USC
  'CIN-UTAH':   4,   // Utah at Cincinnati
  'IOWA-WIS':   4,   // Wisconsin at Iowa
  'AUB-MISS':   3,   // Auburn at Ole Miss
  'IU-MINN':    3,   // Minnesota at Indiana
  'NU-ORE':     3,   // Northwestern at Oregon
  'BOIS-TXST':  3,   // Texas State at Boise State
  'MIA-UNC':    2,   // Miami at North Carolina
  'ASU-BYU':    2,   // Arizona State at BYU
  'UVA-WAKE':   2,   // Virginia at Wake Forest
  'ISU-OKST':   2,   // Oklahoma State at Iowa State
  'ARK-MIZ':    2,   // Missouri at Arkansas
  'SMU-SYR':    2,   // SMU at Syracuse
  'MSST-TEX':   2,   // Mississippi State at Texas
  'NEV-UCLA':   1,   // Nevada at UCLA
  'NAVY-ND':    1,   // Notre Dame at Navy
};

// Live playoff-SEEDING race, separate from the standings signal elsewhere in
// this file. That signal only measures "will this team make the playoffs at
// all" (playoff-percent) — it goes quiet once a team is basically locked in,
// even if they're in a real dogfight over SEED, which matters a lot (home
// field, who you face). This list fills that specific gap. Per-team, 0-5 —
// listed teams get credit in every game, more when they play another listed
// team. Moves fast in September — update every few days during the stretch
// run by searching "mlb playoff picture" or "mlb wild card standings" for
// the current week, same idea as the CFB/MLB lists above.
const PLAYOFF_RACE = {
  // EMPTY for the 2026 postseason (regular season ended Sept 27). Postseason
  // games skip the race/standings math entirely and are rated by W.playoff +
  // series context instead. Refill next September.
};

// Team quality/brand rank per sport, 1 (best/most notable) to N (worst) — lower
// is better. Used for every game in that sport via both teams' average rank.
// Both are now IN-SEASON POWER RANKINGS, updated regularly as the season
// actually plays out — search "[league] power rankings" for the current
// week (ESPN, Sportsnaut, theScore all publish one) and replace the list.
const TEAM_QUALITY = {
  nfl: { // SportsBrackets.net consensus Power Rankings, Week 8 (Oct 27, 2026; avg of ESPN, CBS, Yahoo, Sportsnaut, WalterFootball) — 32 teams
    BUF:1, SF:2, MIN:3, KC:4, SEA:5, CHI:6, JAX:7, CIN:8, DEN:9, DET:10,
    NE:11, LAR:12, BAL:13, GB:14, CLE:15, PIT:16, ATL:17, NYG:18, CAR:19, HOU:20,
    DAL:21, LV:22, TB:23, PHI:24, IND:25, ARI:26, NO:27, WSH:28, NYJ:29, MIA:30,
    TEN:31, LAC:32,
  },
  nba: { // NBA.com Power Rankings (John Schuhmann), Week 2 (Oct 26, 2026) — 30 teams. Swap to ESPN's once it posts.
    OKC:1, DET:2, MIN:3, HOU:4, PHI:5, SA:6, LAL:7, BOS:8, TOR:9, NY:10,
    CLE:11, DEN:12, ATL:13, IND:14, POR:15, ORL:16, MEM:17, WSH:18, CHA:19, DAL:20,
    MIA:21, PHX:22, UTAH:23, LAC:24, NO:25, GS:26, CHI:27, BKN:28, MIL:29, SAC:30,
  },
  mlb: { // MLB.com Power Rankings, final regular-season edition (Sept 21, 2026) — 30 teams
    MIL:1, LAD:2, TB:3, ATL:4, NYY:5, CHC:6, BOS:7, SD:8, PHI:9, CLE:10,
    CHW:11, TEX:12, ARI:13, HOU:14, TOR:15, PIT:16, BAL:17, MIA:18, DET:19, STL:20,
    WSH:21, SEA:22, NYM:23, MIN:24, CIN:25, KC:26, SF:27, LAA:28, ATH:29, COL:30,
  },
  nhl: { // The Hockey News Power Rankings (Jason Chen), Oct 28, 2026 — 32 teams. THN updates every Wednesday.
    CAR:1, MIN:2, EDM:3, BOS:4, UTAH:5, VGK:6, COL:7, TB:8, NJ:9, DAL:10,
    MTL:11, OTT:12, FLA:13, SEA:14, WSH:15, NYI:16, BUF:17, TOR:18, NYR:19, SJ:20,
    STL:21, PIT:22, NSH:23, CGY:24, DET:25, CBJ:26, CHI:27, ANA:28, WPG:29, LA:30,
    PHI:31, VAN:32,
  },
};

// CFB conference tier — used ONLY when a team is unranked (a ranked team already
// gets a precise score from its actual rank; this fills in "how big a program is
// this" for the 100+ unranked teams, so Michigan State-unranked still reads as a
// real program while East Carolina-unranked doesn't). Based on real 2026 FBS
// conference membership (ACC/Big Ten/Big 12/SEC + Notre Dame = power; everyone
// else = g5). Barely needs updating — only if a team actually changes conference.
const CFB_POWER = new Set([
  // ACC
  'BC','CAL','CLEM','DUKE','FSU','GT','LOU','MIA','NCSU','UNC','PITT','SMU','STAN','SYR','UVA','VT','WAKE',
  // Big 12
  'ARIZ','ASU','BAY','BYU','CIN','COLO','HOU','ISU','KU','KSU','OKST','TCU','TTU','UCF','UTAH','WVU',
  // Big Ten
  'ILL','IU','IOWA','MD','MICH','MSU','MINN','NEB','NU','OSU','ORE','PSU','PUR','RUTG','UCLA','USC','WASH','WIS',
  // SEC
  'ALA','ARK','AUB','FLA','UGA','UK','LSU','MISS','MSST','MIZ','OU','SC','TENN','TEX','TA&M','VAN',
  // Independent
  'ND',
]);
const CFB_G5 = new Set([
  // American
  'ARMY','CLT','ECU','FAU','MEM','NAVY','UNT','RICE','TEM','TULN','TLSA','UAB','USF','UTSA',
  // C-USA
  'DEL','FIU','JXST','KENN','LIB','MTSU','MOST','NMSU','SHSU','WKU',
  // MAC
  'AKR','BALL','BGSU','BUF','CMU','EMU','KENT','M-OH','OHIO','SAC','TOL','MASS','WMU',
  // Mountain West
  'AF','HAW','NEV','UNM','SJSU','UNLV','WYO','NIU','UTEP','NDSU',
  // Pac-12 (reformed 2026)
  'ORST','WSU','BSU','CSU','FRES','SDSU','TXST','USU',
  // Sun Belt
  'APP','ARST','CCU','GAST','GASO','JMU','UL','ULM','LT','MRSH','ODU','USA','USM','TROY',
  // Independent
  'CONN',
]);
// ---------------------------------------------------------------------------

const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/';
const ESPN_STANDINGS = 'https://site.api.espn.com/apis/v2/sports/'; // exact-match 'playoffPercent' (not 'playoffSeed')
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
let on = load();

function load(){
  try{ const s = JSON.parse(localStorage.getItem('whatsOn.sports')); if(Array.isArray(s)) return s; /* empty is valid (Select none) */ }catch(e){}
  return DEFAULT_ON.slice();
}
function save(){ try{ localStorage.setItem('whatsOn.sports', JSON.stringify(on)); }catch(e){} }

// Watchlist — persists across reloads. Old event ids just quietly stop
// matching anything once that game's day has passed, no cleanup needed.
const watchlist = new Set(loadWatchlist());
function loadWatchlist(){
  try{ const s = JSON.parse(localStorage.getItem('whatsOn.watchlist')); if(Array.isArray(s)) return s; }catch(e){}
  return [];
}
function saveWatchlist(){ try{ localStorage.setItem('whatsOn.watchlist', JSON.stringify([...watchlist])); }catch(e){} }

function renderChips(){
  const box = document.getElementById('chips'); box.innerHTML='';
  // Bulk buttons first, so they're visible without scrolling the chip row.
  const bulk = (label, pick)=>{
    const b = document.createElement('button');
    b.className = 'chip bulk'; b.textContent = label;
    b.onclick = ()=>{ on = pick(); save(); renderChips(); refresh(); };
    box.appendChild(b);
  };
  bulk('Select all', ()=>Object.keys(SPORTS));
  bulk('Select none', ()=>[]);
  const sep = document.createElement('span'); sep.className='chip-sep'; box.appendChild(sep);
  for(const k in SPORTS){
    const b = document.createElement('button');
    b.className = 'chip' + (on.includes(k)?' on':''); b.textContent = SPORTS[k].name;
    b.onclick = ()=>{ on = on.includes(k) ? on.filter(x=>x!==k) : [...on,k]; save(); renderChips(); refresh(); };
    box.appendChild(b);
  }
}

async function fetchEspn(path){
  try{
    const r = await fetch(ESPN + path); if(!r.ok) throw new Error(r.status); return await r.json();
  }catch(e){
    // fallback through Netlify proxy (see _redirects file)
    const r = await fetch('/espn/' + path); if(!r.ok) throw new Error(r.status); return await r.json();
  }
}
// Pregame odds cache (Oct 3). ESPN drops the line from the scoreboard once a game
// starts, which broke the odds-based upset logic. The line can't change after kickoff,
// so it's saved once per game: from the scoreboard while the game is still 'pre', or
// from the game's summary page (pickcenter) if the app first sees it already live/final.
// Stored in the same shape as a scoreboard odds object so rate() reads it unchanged.
let pregameOdds = {};
try{ pregameOdds = JSON.parse(localStorage.getItem('whatsOn.pregameOdds')) || {}; }catch(e){}
const oddsTried = new Set(); // summary lookups already attempted this session (incl. failures)
function savePregameOdds(){
  // keep only the most recent ~400 games so storage doesn't grow forever
  const ids = Object.keys(pregameOdds);
  if(ids.length > 400) ids.slice(0, ids.length-400).forEach(id=>delete pregameOdds[id]);
  try{ localStorage.setItem('whatsOn.pregameOdds', JSON.stringify(pregameOdds)); }catch(e){}
}
function oddsFromPick(pk){
  if(!pk) return null;
  const h = pk.homeTeamOdds||{}, a = pk.awayTeamOdds||{};
  if(pk.spread==null && h.moneyLine==null && a.moneyLine==null) return null;
  return { spread: pk.spread, details: pk.details,
    homeTeamOdds:{favorite:!!h.favorite}, awayTeamOdds:{favorite:!!a.favorite},
    moneyline:{ home:{close:{odds:h.moneyLine}}, away:{close:{odds:a.moneyLine}} } };
}
async function fillPregameOdds(key, events){
  const sp = SPORTS[key];
  let changed = false;
  const need = [];
  events.forEach(ev=>{
    const c = (ev.competitions||[])[0]; if(!c) return;
    const state = ev.status && ev.status.type && ev.status.type.state;
    const live = (c.odds||[])[0];
    if(state==='pre'){ if(live){ pregameOdds[ev.id] = live; changed = true; } return; }
    if(live || pregameOdds[ev.id] || oddsTried.has(ev.id)) return;
    need.push(ev.id);
  });
  const base = sp.path.split('?')[0].replace(/scoreboard$/, 'summary');
  await Promise.all(need.map(async id=>{
    oddsTried.add(id);
    try{
      const j = await fetchEspn(base + '?event=' + id);
      const od = oddsFromPick((j.pickcenter||[])[0]);
      if(od){ pregameOdds[id] = od; changed = true; }
    }catch(e){}
  }));
  if(changed) savePregameOdds();
}
async function fetchLeague(key){
  const sp = SPORTS[key];
  const paths = [sp.path, ...(sp.extraPaths||[])];
  // Daily leagues: ESPN's default scoreboard keeps showing yesterday until well
  // after midnight, so also ask for today's date (your local date) explicitly.
  // Default path stays too, so late games still finishing past midnight show up.
  if(sp.daily){
    const d = new Date();
    const ymd = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    paths.push(sp.path + (sp.path.includes('?') ? '&' : '?') + 'dates=' + ymd);
  }
  const results = await Promise.all(paths.map(fetchEspn));
  const seen = new Set(), events = [];
  results.forEach(r => (r.events||[]).forEach(ev => {
    if(!seen.has(ev.id)){ seen.add(ev.id); events.push(ev); }
  }));
  return { events };
}

// Playoff-percent by team abbreviation, per sport. Loaded once and cached —
// standings don't need 30-second refreshes like scores do.
// undefined = not yet attempted, null = attempted and unavailable (falls back to win% proxy).
const standingsCache = {};
async function loadStandings(key){
  const sp = SPORTS[key];
  if(!sp.standingsPath || standingsCache[key]!==undefined) return;
  try{
    // Standings live on ESPN's /apis/v2/ path. The /apis/site/v2/ path that
    // scores use only returns a "Full Standings" link for standings, which
    // silently left this cache empty (fixed Sept 27, 2026).
    const r = await fetch(ESPN_STANDINGS + sp.standingsPath); if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    const raw = {};
    (function walk(node){
      if(!node || typeof node!=='object') return;
      if(Array.isArray(node.entries)){
        node.entries.forEach(e=>{
          const abbr = e.team && e.team.abbreviation;
          if(!abbr) return;
          const stat = (e.stats||[]).find(s=>typeof s.name==='string' && s.name.toLowerCase()==='playoffpercent' && typeof s.value==='number');
          if(stat) raw[abbr] = stat.value;
        });
      }
      for(const k in node) if(k!=='entries') walk(node[k]);
    })(j);
    // Decide percent (0-100) vs fraction (0-1) once from the whole set — a single
    // value near 1 is ambiguous (1% or 100%?), but across many teams someone is
    // reliably above 1.5 if it's percent-scale.
    const vals = Object.values(raw);
    const isPercentScale = vals.some(v=>v>1.5);
    const map = {};
    for(const abbr in raw){ const v = isPercentScale ? raw[abbr]/100 : raw[abbr]; map[abbr] = clamp((v-0.5)*2,-1,1); }
    standingsCache[key] = Object.keys(map).length ? map : null;
    // MLB only for now: other leagues' standings come back grouped by conference,
    // and early-season games-back math would hand out fake race boosts.
    raceCache[key] = key==='mlb' ? computeRaceTightness(j) : null;
  }catch(e){ standingsCache[key] = null; raceCache[key] = null; }
}

// Live division/wild-card race tightness, computed directly from the SAME
// standings fetch above (wins/losses/division) — no hand-maintained list, no
// staleness. Falls back to PLAYOFF_RACE (see above) only for teams this can't
// find data for, in case ESPN's response shape doesn't match what's assumed
// here (unverified from this sandbox — same caveat as playoffPercent above).
const raceCache = {};
function computeRaceTightness(standingsJson){
  const teams = []; // {abbr, wins, losses, division, league, playoffRaw}
  (function walk(node, league, division){
    if(!node || typeof node!=='object') return;
    if(Array.isArray(node.entries)){
      node.entries.forEach(e=>{
        const abbr = e.team && e.team.abbreviation;
        if(!abbr) return;
        const stat = name => { const s=(e.stats||[]).find(x=>typeof x.name==='string' && x.name.toLowerCase()===name); return s ? +s.value : null; };
        const pstat = (e.stats||[]).find(s=>typeof s.name==='string' && s.name.toLowerCase()==='playoffpercent' && typeof s.value==='number');
        teams.push({ abbr, wins: stat('wins'), losses: stat('losses'), division, league, playoffRaw: pstat ? pstat.value : null });
      });
    }
    for(const k in node){
      if(k==='entries') continue;
      const name = node.name;
      const isLeague = typeof name==='string' && /american league|national league|^afc$|^nfc$/i.test(name);
      walk(node[k], isLeague ? name : league, (name && !isLeague) ? name : division);
    }
  })(standingsJson, null, null);

  const valid = teams.filter(t=>t.wins!=null && t.losses!=null && t.division);
  if(valid.length<4) return null; // not enough structure to compute anything meaningful

  const pct = t => t.wins/(t.wins+t.losses);
  const result = {};

  // Wild card tightness needs league grouping, and so does bye-safety below —
  // build this first so both can use it.
  const byLeague = {};
  valid.forEach(t=>{ (byLeague[t.league] = byLeague[t.league]||[]).push(t); });

  // Bye safety: MLB's top 2 seeds in each league get a first-round bye — once a
  // team is clearly one of the two best in their WHOLE league (not just their
  // division), the exact order between them barely matters, since both get the
  // same bye either way. Heavily discounts division-race credit for that team.
  const byeSafety = {}; // abbr -> 0 (no safety margin) .. 1 (fully safe bye spot)
  Object.entries(byLeague).forEach(([league, list])=>{
    if(!league || list.length<3) return;
    const ranked = list.slice().sort((a,b)=>pct(b)-pct(a));
    const cutlinePct = pct(ranked[2]); // 3rd-best in the league = first non-bye seed
    ranked.slice(0,2).forEach(t=>{
      const gamesAhead = (pct(t)-cutlinePct) * (t.wins+t.losses) / 2;
      byeSafety[t.abbr] = clamp(gamesAhead/6, 0, 1);
    });
  });

  // Division tightness: how close is each team to 1st in its own division
  const byDiv = {};
  valid.forEach(t=>{ (byDiv[t.division] = byDiv[t.division]||[]).push(t); });
  Object.values(byDiv).forEach(list=>{
    list.sort((a,b)=>pct(b)-pct(a));
    const leaderPct = pct(list[0]);
    list.forEach((t,i)=>{
      const gamesBack = (leaderPct - pct(t)) * (t.wins+t.losses) / 2;
      let tight = clamp(1 - gamesBack/6, 0, 1) * (i<=1 ? 1 : 0.6);
      if(byeSafety[t.abbr]) tight *= (1 - byeSafety[t.abbr]);
      result[t.abbr] = Math.max(result[t.abbr]||0, tight);
    });
  });

  // Wild card tightness: non-division-leaders in each league, how close to the cutline
  Object.entries(byLeague).forEach(([league, list])=>{
    if(!league) return;
    const divLeaders = new Set(Object.values(byDiv)
      .filter(d=>d.some(t=>t.league===league))
      .map(d=>[...d].sort((a,b)=>pct(b)-pct(a))[0].abbr));
    const wcField = list.filter(t=>!divLeaders.has(t.abbr)).sort((a,b)=>pct(b)-pct(a));
    if(wcField.length<4) return;
    const cutlinePct = (pct(wcField[2])+pct(wcField[3]))/2; // between 3rd and 4th wild card
    wcField.forEach(t=>{
      const gamesBack = Math.abs(pct(t)-cutlinePct) * (t.wins+t.losses) / 2;
      const tight = clamp(1 - gamesBack/4, 0, 1); // wild card windows run tighter than division races
      result[t.abbr] = Math.max(result[t.abbr]||0, tight);
    });
  });

  // Gate on REAL playoff-percent (already accounts for games remaining, which
  // the win% math above doesn't) — a tight-looking games-back gap late in the
  // season can still mean "already essentially eliminated." Only zeroes out
  // the low end; a team already near-certain to make it (high percent) still
  // keeps its seeding-race credit from above, since that's the whole point.
  const pvals = teams.map(t=>t.playoffRaw).filter(v=>v!=null);
  if(pvals.length){
    const isPercentScale = pvals.some(v=>v>1.5);
    valid.forEach(t=>{
      if(t.playoffRaw==null || result[t.abbr]==null) return;
      const p = isPercentScale ? t.playoffRaw/100 : t.playoffRaw;
      if(p < W.raceMinPlayoffPct) result[t.abbr] = 0;
    });
  }

  return Object.keys(result).length ? result : null;
}

// How far along the game is, 0 to 1. Also flags overtime.
function progress(sp, st){
  const p = st.period || 0;
  if(sp.innings){
    const detail = (st.type.detail||'').toLowerCase();
    const half = detail.startsWith('end') ? 1 : (detail.startsWith('bot') || detail.startsWith('mid')) ? 0.5 : 0;
    return { f: clamp((p-1+half)/sp.innings,0,1), ot: p > sp.innings };
  }
  const m = /(\d+):?(\d*)/.exec(st.displayClock||''); const min = m ? (+m[1] + (m[2]?+m[2]/60:0)) : 0;
  if(p > sp.periods) return { f:1, ot:true };
  const inPeriod = sp.clockDown ? 1 - clamp(min/sp.len,0,1) : clamp((min - (p-1)*sp.len)/sp.len,0,1);
  return { f: clamp((p-1+inPeriod)/sp.periods,0,1), ot:false };
}

function rate(key, ev){
  const sp = SPORTS[key], c = ev.competitions[0], st = c.status, state = st.type.state;
  const home = c.competitors.find(x=>x.homeAway==='home'), away = c.competitors.find(x=>x.homeAway==='away');
  const hs = +home.score||0, as = +away.score||0, margin = Math.abs(hs-as);
  const why = [];

  // Season ramp — see rampPoint in W. Games played = both teams' average from
  // their overall record (W-L or W-L-OTL). Preseason counts as 0 games.
  // rankMult/standMult are both 1.0 at the 50/50 point, so mid-season behavior
  // matches the old flat weights; early season leans on rankings, late on standings.
  let rankMult = 1, standMult = 1;
  if(sp.games && TEAM_QUALITY[key]){
    const gp = x=>{
      const r = (x.records||[]).find(rr=>rr.name==='overall');
      if(!r || !r.summary) return 0;
      return r.summary.split('-').reduce((a,b)=>a+(+b||0),0);
    };
    const played = (ev.season && ev.season.type===1) ? 0 : (gp(home)+gp(away))/2;
    const p = clamp(played/sp.games, 0, 1);
    const share = p <= W.rampPoint
      ? W.rampMid * p/W.rampPoint
      : Math.min(W.rampMax, W.rampMid + (W.rampMax-W.rampMid) * (p-W.rampPoint)/W.rampPoint);
    rankMult = Math.min(1, (1-share)/0.5); standMult = share/0.5; // capped at 1.0 Oct 3 — early season was boosting rankings ~1.9x while standings added nothing yet
  }

  // odds
  const o = (c.odds||[])[0] || pregameOdds[ev.id]; let favHome=null, spread=0, ml=0; // pregame line survives kickoff via cache
  if(o){
    spread = Math.abs(+o.spread||0);
    if(o.homeTeamOdds && o.homeTeamOdds.favorite) favHome = true;
    else if(o.awayTeamOdds && o.awayTeamOdds.favorite) favHome = false;
    else if(o.details){ const d=/^(\w+)\s-/.exec(o.details); if(d) favHome = d[1]===home.team.abbreviation; }
    const mline = o.moneyline || {};
    const mlHome = Math.abs(+((mline.home && mline.home.close && mline.home.close.odds)) || 0);
    const mlAway = Math.abs(+((mline.away && mline.away.close && mline.away.close.odds)) || 0);
    ml = favHome===true ? mlAway : favHome===false ? mlHome : Math.max(mlHome,mlAway);
  }
  // How much of an underdog, 0..1 — a true toss-up scores ~0, a big dog scores toward 1.
  // This single number drives the whole upset bonus below; no separate threshold needed.
  const dogScale = sp.spreadBased ? clamp(spread/14, 0, 1) : clamp((ml-100)/300, 0, 1);

  // context
  let ctx = (sp.interest||0) * W.sportInterest;
  const isPost = !!(ev.season && ev.season.type === 3);
  let importanceFloor = 0; // 0..10, set below for elimination / winner-take-all games
  if(ev.season && ev.season.type === 1){ ctx += W.preseason; why.push('Preseason'); }
  if(isPost){
    ctx += W.playoff;
    // Series context from ESPN (best-of-3/5/7). Single-game rounds (NFL) have
    // no series data and are unaffected.
    const sr = c.series;
    const total = sr && sr.totalCompetitions;
    const sw = sr && (sr.competitors||[]).map(x=>+x.wins||0);
    if(total>1 && sw && sw.length===2){
      const need = Math.ceil(total/2);
      const onBrink = sw.filter(w=>w===need-1).length; // teams one win from advancing
      if(onBrink===2){ ctx += W.seriesDecider; importanceFloor = W.deciderImportanceFloor; why.push('Winner take all'); }
      else if(onBrink===1){
        ctx += W.seriesElim;
        importanceFloor = W.elimImportanceFloor;
        // The team facing elimination is the one NOT one win from advancing.
        const facing = (sr.competitors||[]).find(x=>(+x.wins||0)!==need-1);
        const fc = facing && c.competitors.find(x=>String(x.id)===String(facing.id));
        const ab = fc && fc.team && fc.team.abbreviation;
        why.push(ab ? `Elimination game: ${ab}` : 'Elimination game');
      }
      else why.push('Playoffs');
    } else why.push('Playoffs');
    // Title round, read from ESPN's game note (e.g. "World Series - Game 2").
    // Stacks with the series elimination/decider boosts above, so a Game 7 gets both.
    const champNote = (c.notes||[]).map(n=>n.headline||'').find(h=>/world series|nba finals|wnba finals|stanley cup final|super bowl|mls cup|national championship/i.test(h));
    if(champNote){
      ctx += W.championship;
      importanceFloor = Math.max(importanceFloor, W.champImportanceFloor);
      const pi = why.indexOf('Playoffs'); const label = champNote.split(' - ')[0].trim();
      if(pi>=0) why[pi] = label; else why.unshift(label);
    } else {
      const semiNote = (c.notes||[]).map(n=>n.headline||'').find(h=>/\bALCS\b|\bNLCS\b|conference finals?\b|AFC championship|NFC championship|semi-?finals?\b/i.test(h));
      if(semiNote) ctx += W.semifinal;
    }
  }
  // ESPN tags each league's blanket out-of-market streaming package as "national"
  // on every game, which isn't meaningful — ignore those entirely.
  const IGNORE_NETS = ['MLB.TV'];
  // Streaming-only services ESPN also tags "national" — still shown as where
  // to watch, but they don't earn the national TV / primetime bonus.
  const STREAMING = ['ESPN+', 'Peacock'];
  const natSet = new Set(), locSet = new Set();
  (c.broadcasts||[]).forEach(b=>{
    const isNat = (b.market||'').toLowerCase()==='national';
    (b.names||[]).forEach(n=>{ if(!IGNORE_NETS.includes(n)) ((isNat && !STREAMING.includes(n))?natSet:locSet).add(n); });
  });
  if(!natSet.size && !locSet.size){
    (c.geoBroadcasts||[]).forEach(g=>{
      if(!g.media || !g.media.shortName || IGNORE_NETS.includes(g.media.shortName)) return;
      const isNat = g.market && (g.market.type||'').toLowerCase()==='national';
      ((isNat && !STREAMING.includes(g.media.shortName))?natSet:locSet).add(g.media.shortName);
    });
  }
  locSet.forEach(n=>{ if(natSet.has(n)) locSet.delete(n); });
  const nets = [...natSet, ...locSet]; // national channel first, local channels after
  const isNational = natSet.size > 0;
  if(isNational){ ctx += W.national; }
  const hour = new Date(ev.date).getHours();
  if(hour>=17 && hour<=20){ ctx += W.evening; }
  const rk = x=>(x.curatedRank&&x.curatedRank.current)||99;
  if(rk(home)<=10 && rk(away)<=10){ ctx += W.rankedBoth + W.top10Showdown; why.unshift('Top 10 showdown'); }
  else if(rk(home)<26 && rk(away)<26){ ctx += W.rankedBoth; }
  else if(rk(home)<=10 || rk(away)<=10){ ctx += W.top10; }

  // hand-maintained watchability list (see WATCHABILITY above)
  const wKey = [home.team.abbreviation, away.team.abbreviation].sort().join('-');
  if(WATCHABILITY[wKey]!=null){
    const wr = WATCHABILITY[wKey];
    // Oct 24: this is a PREGAME prediction, so it fades out once the game is live —
    // full weight before kickoff, half at halftime, zero by the final whistle.
    // (A 5/5 game was getting the full +1.5 on top of ranked bonuses all game long,
    // pushing a 3-0 2nd-quarter game to 9.0.)
    const wFade = state==='pre' ? 1 : state==='in' ? 1 - progress(sp, st).f : 0;
    ctx += (wr-3)/2 * W.watchability * wFade; // 3 = no effect, 5 = full boost, 1 = full penalty
    if(wr>=4) why.push('Marquee matchup');
  }

  // team-quality/brand adjustment (see TEAM_QUALITY above) — applies to every
  // game in any sport that has a list, scaled to that list's own team count
  const tq = TEAM_QUALITY[key];
  if(tq){
    const n = Object.keys(tq).length;
    const rankToScore = r => 5 - (r-1)*4/(n-1); // rank 1..n -> score 5..1
    const twHome = tq[home.team.abbreviation], twAway = tq[away.team.abbreviation];
    if(twHome!=null && twAway!=null){
      const avgScore = (rankToScore(twHome) + rankToScore(twAway)) / 2;
      ctx += (avgScore-3)/2 * W.teamWatch * rankMult;
    }
  }

  // Unified 0..1 "how notable are these teams" signal, reusing whichever data
  // source this sport already has (TEAM_QUALITY list, or curatedRank for
  // sports where ranking is a real concept). null = no signal exists at all
  // for this sport (NHL, WNBA, MLS, EPL) — different from a real signal that
  // happens to be low (two unranked CFB teams are genuinely informative: most
  // of 130+ teams aren't ranked, so that's not "neutral," it's "probably not
  // a marquee program"). Used below to scale the late-game boost AND as a hard
  // ceiling, so two unranked teams can't stack their way to a 10 on closeness alone.
  let quality01 = null;
  if(tq && tq[home.team.abbreviation]!=null && tq[away.team.abbreviation]!=null){
    const n = Object.keys(tq).length;
    const toQ = r => 1 - (r-1)/(n-1); // rank1 -> 1, rankN -> 0
    quality01 = (toQ(tq[home.team.abbreviation]) + toQ(tq[away.team.abbreviation])) / 2;
  } else if(sp.hasRanking){
    // Ranked teams get a precise score from their actual rank. Unranked teams
    // fall back to CFB conference tier when available (Michigan State-unranked
    // still reads as a real program; East Carolina-unranked doesn't) — or a flat
    // baseline for sports where we don't have that (CBB, for now).
    const confTier = ab => key==='cfb' ? (CFB_POWER.has(ab) ? 0.7 : CFB_G5.has(ab) ? 0.25 : 0.3) : 0.3;
    const toQ = (ab, r) => r<=25 ? 1-(r-1)*0.25/24 : confTier(ab);
    quality01 = (toQ(home.team.abbreviation, rk(home)) + toQ(away.team.abbreviation, rk(away))) / 2;
    // Who's playing now counts toward Importance and the rating itself (pregame
    // and live), not just the ceiling. 0.5 = neutral; ranked Power teams push up,
    // G5/unranked-small pairings push down. (Sports with a TEAM_QUALITY list
    // already get this through W.teamWatch above, so it's not added twice.)
    ctx += (quality01 - 0.5) * W.rankQuality;
  }

  // playoff stakes: real playoff-percent from standings when we have it,
  // otherwise fall back to each team's win% (0..1, same shape either way) —
  // but the fallback is a much weaker signal, so it counts for less and never
  // claims the confident "Playoff race" / "Non-contenders" label.
  let stakesCtx = 0; // standings contribution, so the race boost below doesn't double count it
  const stMap = standingsCache[key];
  const hasRealStandings = !!(stMap && stMap[home.team.abbreviation]!=null && stMap[away.team.abbreviation]!=null);
  let pHome=null, pAway=null;
  if(hasRealStandings){
    // cache stores a -1..1 value; convert back to a 0..1 "chance" for the shared math below
    pHome = stMap[home.team.abbreviation]/2 + 0.5;
    pAway = stMap[away.team.abbreviation]/2 + 0.5;
  } else {
    const winPct = x=>{
      const r = (x.records||[]).find(rr=>rr.name==='overall');
      if(!r || !r.summary) return null;
      const m = /^(\d+)-(\d+)/.exec(r.summary);
      if(!m) return null;
      const w=+m[1], l=+m[2];
      return (w+l>=20) ? w/(w+l) : null; // ignore tiny early-season samples
    };
    pHome = winPct(home); pAway = winPct(away);
  }
  // Postseason: every team is a playoff team, and regular-season standings /
  // race math would hand out stale "Playoff race" boosts. W.playoff + series
  // context above already cover it.
  if(!isPost && pHome!=null && pAway!=null){
    const alive = p => p >= 0.05;                                  // below 5% counts as functionally dead
    const tension = p => clamp(1 - Math.abs(p-0.5)/0.45, 0, 1);     // peaks at a true 50/50 race, fades to 0 by ~5%/95%
    let stakes;
    if(!alive(pHome) && !alive(pAway)){ stakes = -1; }
    else {
      stakes = (tension(pHome)+tension(pAway))/2;
      if(hasRealStandings && stakes>=0.7) why.push('Playoff race');
    }
    stakesCtx = stakes * (hasRealStandings ? W.standings : W.standings*0.4) * standMult;
    ctx += stakesCtx;
  }

  // Seeding-race intensity, 0..1 per team — prefers the live computation above
  // (computeRaceTightness), falls back to the hand-maintained PLAYOFF_RACE list
  // only for teams that computation doesn't have data for.
  const raceFor = ab => {
    const live = raceCache[key];
    const liveVal = live && live[ab]!=null ? live[ab] : null;
    const handVal = (key==='mlb' && PLAYOFF_RACE[ab]!=null) ? PLAYOFF_RACE[ab]/5 : null; // MLB-only list — team codes overlap other sports (TEX = Rangers AND Longhorns)
    // MLB: when the hand list has entries, it's authoritative for EVERY MLB team.
    // The live math only sees games-back, not clinches/locked seeds, so on the
    // final day it was crediting locked teams (BOS/CHC) and burying HOU/TEX.
    if(key==='mlb' && Object.keys(PLAYOFF_RACE).length) return handVal||0;
    return liveVal!=null ? liveVal : (handVal||0);
  };
  const raceHome = isPost ? 0 : raceFor(home.team.abbreviation), raceAway = isPost ? 0 : raceFor(away.team.abbreviation);
  if(raceHome>0 || raceAway>0){
    // Same reason as the standings boost above (team is in a playoff race), so only
    // add whatever the race boost adds BEYOND that — not both stacked.
    // One team playing for its season is enough to make the game matter, so lean
    // on the bigger of the two (80/20) instead of a straight average, which cut
    // a win-and-in game in half whenever the opponent had nothing to play for.
    const raceGame = 0.8*Math.max(raceHome,raceAway) + 0.2*Math.min(raceHome,raceAway);
    ctx += Math.max(0, raceGame * W.playoffRace - Math.max(0, stakesCtx));
    if(Math.max(raceHome,raceAway)>=0.7) why.unshift('Postseason race');
  }

  let r, comp01, drama01;
  if(state==='pre'){
    let close = 0.5;
    if(o){ close = sp.spreadBased ? clamp(1 - spread/(sp.preCloseAt||14),0,1) : clamp(1 - (ml-100)/150,0,1); } // preCloseAt: spread where pregame closeness hits zero (CFB 21, Oct 3 — big CFB spreads were zeroing out marquee games)
    // A close spread is worth more when the teams matter: scaled 0.6x (weakest
    // pairing) to 1.4x (two top teams), neutral 1.0x when a sport has no quality
    // signal. So a close ranked game beats a lopsided marquee game, without also
    // pushing G5 pick-ems up the list.
    const spreadMult = quality01!=null ? 0.6 + 0.8*quality01 : 1.0;
    r = W.preBase + W.preSpread*close*spreadMult + ctx;
    comp01 = close; drama01 = close; // pregame "drama" is really just anticipation from the expected closeness
  } else if(state==='in'){
    const {f, ot} = progress(sp, st);
    // "Late" cutoff: baseball = start of the 7th inning; clock sports = start of the final period.
    const LATE = sp.innings ? 6/sp.innings : 0.75;
    // Live games: basketball uses closeAt (15 pts) as the zero-closeness line,
    // since a 9-12 pt lead is still catchable. Finished games keep unit*3.
    let close = clamp(1 - margin/(sp.closeAt || sp.unit*3),0,1);
    // Basketball: comebacks from 15-25 down happen, so any game short of the
    // Blowout line keeps at least 10% closeness credit (no tag for it).
    if(sp.blowoutAt && margin < sp.blowoutAt[f<0.5?0:1]) close = Math.max(close, 0.10);
    // Smoothly interpolated between the checkpoints in W — see comment up there.
    // The late-game portion (past the midpoint) is scaled by quality, so the
    // full escalation is reserved for genuinely notable teams, not any tied game.
    const qForMult = quality01 ?? 0.5; // neutral only when this sport has no signal at all
    const scaledLate = W.timeMid + (W.timeLate-W.timeMid)*qForMult;
    const scaledEnd  = W.timeMid + (W.timeEnd -W.timeMid)*qForMult;
    const scaledOT   = W.timeMid + (W.timeOT  -W.timeMid)*qForMult;
    const timeMult = ot ? scaledOT
      : f<=0.5  ? W.timeStart + (W.timeMid-W.timeStart)*(f/0.5)
      : f<=LATE ? W.timeMid   + (scaledLate-W.timeMid)*((f-0.5)/(LATE-0.5))
      :           scaledLate  + (scaledEnd-scaledLate)*((f-LATE)/(1-LATE));
    r = W.liveBase + W.liveClose*close*timeMult;
    if(ot){ r += W.otBonus; why.unshift(sp.innings?'Extra innings':'Overtime'); }
    else if(f>=LATE && margin<=sp.unit){ r += W.wireBonus; why.unshift('Down to the wire'); }
    else if(f>=0.5 && margin<=sp.unit){ why.unshift('One-score game'); } // halfway on; late = Down to the wire
    else if(sp.blowoutAt ? margin>=sp.blowoutAt[f<0.5?0:1] : close===0){ why.unshift('Blowout'); } // basketball: 30+ 1st half, 25+ 2nd half; others: 3+ scores
    const dogLeads = favHome!==null && margin>0 && ((favHome && as>hs) || (!favHome && hs>as));
    if(dogLeads){ r += W.upsetBonus*dogScale*(0.4+0.6*f); } // Oct 24: scaled by game progress — an underdog up 1 in the 3rd quarter was getting the full late-game upset bonus
    const dogTag = dogLeads && dogScale>=0.3;
    // a ranked team trailing is newsworthy on its own — separate from the odds-based
    // upset bonus above, since a team's ranking and its betting line don't always agree.
    // Scaled by how highly ranked (rank 1 = full weight) AND by how close the game
    // still is, so a ranked team down 40 in garbage time doesn't get an inflated boost.
    // "Can they still finish the upset" — wider margin tolerance than the base
    // closeness measure (a 2-score deficit still counts as real appointment
    // viewing for an upset-in-progress), and weighted MORE as the game gets
    // later, not less — that's specifically when people tune in to see if it
    // actually gets finished off.
    // a ranked team in a genuinely close game is upset tension either way — whether
    // they're trailing (could lose outright) or clinging to a one-score lead (the
    // underdog could still complete it). Separate from the odds-based upset bonus
    // above, since a team's ranking and its betting line don't always agree.
    // "Can the underdog still finish it" — wider margin tolerance than the base
    // closeness measure (a 2-score game still counts as real appointment viewing),
    // and weighted MORE as the game gets later, not less — that's specifically
    // when people tune in to see if it actually gets finished off.
    // Oct 3: an upset is defined by the PREGAME LINE (handled above via dogScale).
    // Rankings are only a backup when no line exists at all. Even then, only the
    // better-ranked team can be the one getting upset: counts while it trails by
    // up to 3 scores, or leads by less than 2 scores (underdog still has a shot).
    const rankScale = rv => rv<=25 ? (26-rv)/25 : 0;
    let upsetTension = 0;
    if(favHome===null){
      const rh = rk(home), ra = rk(away);
      const betterHome = rh < ra;
      const betterRank = Math.min(rh, ra);
      if(betterRank<=25 && rh!==ra){
        const betterScore = betterHome ? hs : as, otherScore = betterHome ? as : hs;
        const catchable = betterScore < otherScore
          ? clamp(1 - margin/(sp.unit*3), 0, 1)
          : clamp(1 - margin/(sp.unit*2), 0, 1);
        upsetTension = rankScale(betterRank) * catchable * (0.4 + 0.6*f);
      }
    }
    if(upsetTension>0){ r += W.rankedTrailing*upsetTension; }
    // One upset tag at most (ratings above are unaffected — labels only):
    // halfway to late = 'Upset brewing' (underdog leading), late = 'Upset alert'
    // (underdog leading OR a ranked team in real upset danger). Nothing before halfway.
    if(f>=LATE && (dogTag || upsetTension>=0.15)) why.unshift('Upset alert');
    else if(f>=0.5 && f<LATE && dogTag) why.unshift('Upset brewing');
    if(sp.liveScale) r *= sp.liveScale; // per-league damper on the live score-based part only (see SPORTS); context below is untouched
    r += ctx;
    // Competitiveness: still primarily the current margin, but a tie/close
    // score is trusted more the longer it's held up — the same 3-3 tie means
    // less 3 seconds into the game than it does at the two-minute warning.
    comp01 = close * (0.4 + 0.6*f);
    // Drama uses the SAME late-game curve but without the quality scaling —
    // urgency is urgency regardless of who's playing; that's Stakes' job.
    const dramaTimeMult = ot ? W.timeOT
      : f<=0.5  ? W.timeStart + (W.timeMid-W.timeStart)*(f/0.5)
      : f<=LATE ? W.timeMid   + (W.timeLate-W.timeMid)*((f-0.5)/(LATE-0.5))
      :           W.timeLate  + (W.timeEnd-W.timeLate)*((f-LATE)/(1-LATE));
    // Normalized against its own max (not shifted to a hard zero at kickoff) —
    // dramaTimeMult is never actually zero, so this shouldn't be either.
    let dramaRaw = clamp(close * (dramaTimeMult/W.timeOT), 0, 1);
    if(ot) dramaRaw = Math.max(dramaRaw, 0.9);
    if(f>=LATE && margin<=sp.unit) dramaRaw = Math.max(dramaRaw, 0.7);
    if(dogScale>=0.3) dramaRaw = Math.max(dramaRaw, 0.5+dogScale*0.4);
    if(upsetTension>=0.15) dramaRaw = Math.max(dramaRaw, 0.5+upsetTension*0.4);
    drama01 = clamp(dramaRaw, 0, 1);
  } else {
    const {ot} = progress(sp, st);
    const close = clamp(1 - margin/(sp.unit*3),0,1);
    const dogWon = favHome!==null && margin>0 && ((favHome && as>hs) || (!favHome && hs>as));
    r = W.finalBase + W.finalClose*close + (ot?W.finalOT:0) + (dogWon?W.finalUpset*dogScale:0) + ctx*W.finalContext;
    comp01 = close;
    let dramaRaw = close;
    if(ot) dramaRaw = Math.max(dramaRaw, 0.9);
    if(dogWon && dogScale>=0.3) dramaRaw = Math.max(dramaRaw, 0.5+dogScale*0.4);
    drama01 = clamp(dramaRaw, 0, 1);
    if(ot) why.unshift(sp.innings?'Extra innings':'Overtime');
    if(dogWon && dogScale>=0.3) why.unshift('Upset');
    else if(margin<=sp.unit) why.unshift('Close finish');
  }
  // Soft ceiling: below W.softCeiling, nothing changes. Above it, each extra
  // point of raw excitement buys progressively less displayed rating, so
  // stacking several boosts at once (great teams + national TV + tied + late)
  // pushes toward 10 without casually reaching it — an exact 10.0 stays rare,
  // and games that would've all flatly clamped to "10" stay distinguishable.
  const T = W.softCeiling, k = W.softCeilingSoftness;
  const pre = state==='pre';
  const cT = pre ? W.preSoftCeiling : T, cMax = pre ? W.preMax : 10, cK = pre ? W.preSoftness : k;
  const shown = r<=cT ? r : cT + (cMax-cT)*(1-Math.exp(-(r-cT)/cK));
  // Hard ceiling tied to team quality — only when a REAL signal exists (see
  // quality01 above). Two unranked teams (quality01 ~0.3) cap around 7.2, no
  // matter how close or late the game gets; a genuine marquee matchup
  // (quality01 ~1.0) isn't capped below 10 at all.
  // sqrt curve, not linear — a middling pairing (quality01 ~0.3-0.4, like most
  // NFL teams that aren't great) still gets most of the ceiling; only a
  // genuinely bottom-tier pairing (quality01 near 0) stays capped down near
  // qualityCapBase.
  const qCap = quality01!=null ? (W.qualityCapBase + W.qualityCapRange*Math.sqrt(quality01)) : 10;
  // Stakes: everything about why this matchup matters, independent of the
  // current score — reuses ctx directly, since that's exactly what ctx already
  // is (sport interest, playoff, national TV, ranked/watchability, team quality,
  // standings). Normalized against a realistic ctx range, not the full
  // mathematical extreme, so a genuinely stakes-heavy game reaches the top.
  // Elimination games: Importance is about what's on the line, so a low sport
  // baseline (MLB, NHL) can't drag it under the floor. Display only; the rating
  // itself still respects each league's caps.
  const stakes01 = Math.max(clamp((ctx - W.stakesFloor) / W.stakesRange, 0, 1), importanceFloor/10);
  return { r: clamp(Math.round(Math.min(shown,qCap)*10)/10,1,10),
    comp: Math.round(comp01*100)/10, drama: Math.round(drama01*100)/10, stakes: Math.round(stakes01*100)/10,
    state, home, away, hs, as, st, nets, isNational, why: why.slice(0,3), ev, key };
}

function cls(r){ return r>=8.5?'r-hot':r>=7?'r-warm':r>=5?'r-mild':'r-cool'; }
function team(t, score, lead, state){
  const rk = t.curatedRank&&t.curatedRank.current<26 ? `<span class="rank">${t.curatedRank.current}</span>` : '';
  const s = state==='pre' ? '' : ` ${score}`;
  return `<span class="${lead?'lead':'trail'}">${rk}${t.team.abbreviation}${s}</span>`;
}
function statusText(g){
  const d = new Date(g.ev.date);
  if(g.state==='pre') return d.toLocaleDateString([], {weekday:'short'}) + ' ' + d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  return `<b>${g.st.type.shortDetail}</b>`;
}
function card(g){
  const label = g.state==='pre' ? 'upcoming' : g.state==='in' ? 'live' : 'final';
  const netLines = g.nets.map((n,i)=>`<div class="${i===0 && g.isNational?'net-nat':'net-loc'}">${n}</div>`).join('');
  const isOpen = expandedGames.has(g.ev.id);
  const isWatched = watchlist.has(g.ev.id);
  const sub = (label,val) => `<div class="subscore"><span>${label}</span><b>${val.toFixed(1)}</b></div>`;
  return `<div class="game ${g.state}${isOpen?' expanded':''}" data-id="${g.ev.id}">
    <button class="star${isWatched?' on':''}" data-star-id="${g.ev.id}" aria-label="Track this game">${isWatched?'★':'☆'}</button>
    <div class="rating ${cls(g.r)}">${g.r.toFixed(1)}<small>${SPORTS[g.key].name}</small></div>
    <div>
      <div class="teams">${team(g.away,g.as,g.as>=g.hs,g.state)}${team(g.home,g.hs,g.hs>=g.as,g.state)}</div>
      <div class="status">${statusText(g)}</div>
      ${netLines?`<div class="nets">${netLines}</div>`:''}
      ${g.why.length?`<div class="why">${g.why.join(', ')}<span class="chevron">${isOpen?'▲':'▼'}</span></div>`:`<div class="why">&nbsp;<span class="chevron">${isOpen?'▲':'▼'}</span></div>`}
      <div class="breakdown">${sub('Competitiveness',g.comp)}${sub('Importance',g.stakes)}${sub('Drama',g.drama)}</div>
    </div></div>`;
}

let timer=null;
let lastGames = [];
const expandedGames = new Set(); // game ids currently showing their breakdown — survives refreshes

function renderList(games){
  const list = document.getElementById('list');
  const errs = games.filter(g=>g.err).map(g=>SPORTS[g.err].name);
  const by = s=>games.filter(g=>!g.err&&g.state===s).sort((a,b)=>b.r-a.r);
  let html='';
  const sec=(title,arr)=>{ if(arr.length) html += `<h2>${title}</h2>` + arr.map(card).join(''); };

  sec('Live now', by('in'));

  const dayKey = d => d.toDateString(); // local calendar day
  const dayLabel = d => {
    const today = new Date(), tmrw = new Date(); tmrw.setDate(today.getDate()+1);
    if(dayKey(d)===dayKey(today)) return 'Today';
    if(dayKey(d)===dayKey(tmrw)) return 'Tomorrow';
    return d.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
  };
  const upcoming = by('pre');
  const groups = new Map(); // dayKey -> {date, games}
  upcoming.forEach(g=>{
    const d = new Date(g.ev.date);
    const k = dayKey(d);
    if(!groups.has(k)) groups.set(k, {date:d, games:[]});
    groups.get(k).games.push(g);
  });
  const days = [...groups.values()].sort((a,b)=>a.date-b.date);
  const todayKey = dayKey(new Date());
  // Order: Live, today's upcoming, Final, then later days — so today's
  // results aren't buried under tomorrow's slate.
  const todayGrp = days.find(d=>dayKey(d.date)===todayKey);
  const later = days.filter(d=>dayKey(d.date)!==todayKey);
  if(todayGrp) html += '<h2>Coming up</h2><h3 class="day">Today</h3>' + todayGrp.games.map(card).join('');
  sec('Final', by('post'));
  if(later.length){
    html += `<h2>${todayGrp ? 'Later' : 'Coming up'}</h2>`;
    later.forEach(({date, games})=>{
      html += `<h3 class="day">${dayLabel(date)}</h3>` + games.map(card).join('');
    });
  }
  if(errs.length) html += `<div class="err">Couldn't load ${errs.join(', ')}. Try again in a minute.</div>`;
  if(!html) html = '<div class="empty">No games today for the sports you picked.</div>';
  list.innerHTML = html;
  document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  renderWatchlist(games);
}

function renderWatchlist(games){
  const order = {in:0, pre:1, post:2};
  const watched = games.filter(g=>!g.err && watchlist.has(g.ev.id)).sort((a,b)=>(order[a.state]-order[b.state]) || (b.r-a.r));
  const watchHtml = watched.length ? watched.map(card).join('') : '<div class="sidebar-empty">Tap the star on any game to track it here.</div>';
  const sidebarBox = document.getElementById('watchlist');
  if(sidebarBox) sidebarBox.innerHTML = watchHtml;
  const mobileBox = document.getElementById('mobileWatchlist');
  if(mobileBox) mobileBox.innerHTML = watchHtml;
}

async function refresh(){
  const list = document.getElementById('list');
  if(!on.length){ list.innerHTML='<div class="empty">Pick a sport above to see what\'s worth watching.</div>'; return; }
  on.forEach(k=>{ loadStandings(k); }); // fire-and-forget, cached after first success/failure
  const results = await Promise.all(on.map(async k=>{
    try{ const j = await fetchLeague(k); await fillPregameOdds(k, j.events||[]); return (j.events||[]).map(ev=>rate(k,ev)); }
    catch(e){ return [{err:k}]; }
  }));
  lastGames = results.flat();
  renderList(lastGames);
}
let mobileTab = 'all';
function renderMobileTabs(){
  document.querySelectorAll('.mobiletabs button').forEach(b=>{
    b.classList.toggle('on', b.dataset.tab===mobileTab);
  });
  document.body.classList.toggle('tab-watchlist', mobileTab==='watchlist');
}
document.body.addEventListener('click', e=>{
  const tabEl = e.target.closest('[data-tab]');
  if(tabEl){ mobileTab = tabEl.dataset.tab; renderMobileTabs(); return; }
  const starEl = e.target.closest('[data-star-id]');
  if(starEl){
    const id = starEl.dataset.starId;
    if(watchlist.has(id)) watchlist.delete(id); else watchlist.add(id);
    saveWatchlist();
    renderList(lastGames);
    return;
  }
  const el = e.target.closest('.game[data-id]');
  if(!el) return;
  const id = el.dataset.id;
  if(expandedGames.has(id)) expandedGames.delete(id); else expandedGames.add(id);
  renderList(lastGames);
});
function schedule(){ clearInterval(timer); if(!document.hidden){ refresh(); timer=setInterval(refresh,30000); } }
document.addEventListener('visibilitychange', schedule);
renderChips(); schedule();
</script>
